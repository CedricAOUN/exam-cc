# CI/CD pipeline: install -> lint/test/audit -> integration -> build & push images -> deploy.
name: CI/CD

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: Lint, unit tests, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            gateway/package-lock.json
            microservices/*/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm run install:all
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Unit tests (backend + frontend)
        run: npm test
      - name: Dependency audit (production deps)
        run: |
          for dir in backend frontend gateway microservices/notifications microservices/stock-management; do
            echo "::group::npm audit $dir"
            npm audit --omit=dev --audit-level=high --prefix "$dir"
            echo "::endgroup::"
          done

  integration:
    name: Integration tests (Docker Compose)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated integration stack
        env:
          # Throwaway secrets for this run only.
          COMPOSE_BAKE: 'false'
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          export SERVICE_TOKEN="$(openssl rand -hex 32)"
          npm run test:integration
      - name: Tear down
        if: always()
        run: docker compose -p exam1-audit-test -f docker-compose.yml -f docker-compose.test.yml down -v
        env:
          JWT_SECRET: unused-in-teardown
          SERVICE_TOKEN: unused-in-teardown

  build-push:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
          - image: frontend
            context: ./frontend
          - image: gateway
            context: ./gateway
          - image: notifications
            context: ./microservices/notifications
          - image: stock-management
            context: ./microservices/stock-management
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/exam1-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Trigger Render deploy hooks
        env:
          HOOKS: |
            ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
            ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
            ${{ secrets.RENDER_DEPLOY_HOOK_GATEWAY }}
            ${{ secrets.RENDER_DEPLOY_HOOK_NOTIFICATIONS }}
            ${{ secrets.RENDER_DEPLOY_HOOK_STOCK }}
        run: |
          count=0
          while IFS= read -r hook; do
            [ -z "$hook" ] && continue
            curl --fail --silent --show-error -X POST "$hook" > /dev/null
            count=$((count + 1))
          done <<< "$HOOKS"
          echo "Triggered $count deploy hook(s)."
          [ "$count" -gt 0 ] || echo "::warning::No RENDER_DEPLOY_HOOK_* secrets set; relying on Render auto-deploy."
